<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mizan: daily, monthly and yearly budgeting with cards, loans, goals and zakat. Arabic and English.">
<meta name="theme-color" content="#0F7D6D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mizan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mizan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone-width ledger column with a sticky header and a bottom tab bar; the balance beam on Daily is the one signature element. */
:root {
  --bg: #EDF2F0; --surface: #FFFFFF; --surface-2: #E2EAE7; --ink: #0E2925; --muted: #5A716D; --line: #D2DDD9;
  --accent: #0F7D6D; --accent-ink: #FFFFFF; --brass: #A47722; --good: #1D8549; --warn: #B8640F; --bad: #C63737;
  --c-fixed: #4F55C9; --c-variable: #1E9C8A; --c-transfer: #E07B2C;
  --f-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Readex Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1513; --surface: #11201D; --surface-2: #192D29; --ink: #E3EEEB; --muted: #8DA5A0; --line: #22403A;
  --accent: #34B39E; --accent-ink: #052019; --brass: #D8A748; --good: #4CC17E; --warn: #E89A4A; --bad: #EF6B6B;
  --c-fixed: #8C91F0; --c-variable: #45C7B3; --c-transfer: #F0A060; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A1513; --surface: #11201D; --surface-2: #192D29; --ink: #E3EEEB; --muted: #8DA5A0; --line: #22403A;
  --accent: #34B39E; --accent-ink: #052019; --brass: #D8A748; --good: #4CC17E; --warn: #E89A4A; --bad: #EF6B6B;
  --c-fixed: #8C91F0; --c-variable: #45C7B3; --c-transfer: #F0A060; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .tile b, .amt { font-variant-numeric: tabular-nums; }
.app { max-width: 640px; margin: 0 auto; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 14px 10px; }
.top h1 { font-family: var(--f-display); font-weight: 600; font-size: 26px; margin: 0; flex: 1; min-width: 0; text-wrap: balance; letter-spacing: -0.01em; }
.top .back { border: 0; background: none; color: var(--accent); font-size: 15px; padding: 6px 0; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); padding: 0; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.latest { display: flex; align-items: center; gap: 10px; width: 100%; border: 1px dashed var(--line); background: var(--surface); border-radius: var(--radius); padding: 9px 12px; color: var(--ink); text-align: start; font-size: 13.5px; }
.latest .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; flex: none; }
.latest .amt { white-space: nowrap; flex: none; }
.latest .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.banner.home { background: color-mix(in srgb, var(--accent) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.banner.home b { font-size: 14px; }
.say { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: var(--radius); padding: 6px 6px 6px 12px; }
.say .mic { font-size: 16px; }
.say input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 15px; padding: 8px 0; color: var(--ink); outline: none; }
.steps { margin: 0; padding-inline-start: 22px; display: grid; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 5px 11px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; text-align: start; }

/* tabs */
.tabs { position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs-inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { border: 0; background: none; padding: 6px 2px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* panels */
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.stack > * { min-width: 0; }
.panel { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 4px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.panel-f { padding: 6px 4px 0; font-size: 12.5px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); min-width: 0; }
.panel > .row:first-child, .panel > :first-child.row { border-top: 0; }
button.row { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: start; }
.panel > button.row:first-child { border-top: 0; }
button.row:hover { background: var(--surface-2); }
.row .grow { flex: 1; min-width: 0; }
.row .sub.wrap { white-space: normal; }
.row .sub { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { white-space: nowrap; font-weight: 500; }
.pos { color: var(--good); } .neg { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); }
.note { padding: 10px 14px; font-size: 13px; border-top: 1px solid var(--line); }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-weight: 500; font-size: 17px; margin-bottom: 4px; }

.badge { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 600; font-size: 13px; }
.badge.sm { width: 26px; height: 26px; font-size: 11px; border-radius: 7px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; padding: 14px; }
.tile { min-width: 0; }
.tile span { display: block; font-size: 12px; color: var(--muted); }
.tile b { display: block; font-family: var(--f-display); font-weight: 500; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chip.good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }

/* month switcher */
.switch { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: var(--radius); padding: 4px; }
.switch button { border: 0; background: none; padding: 8px 12px; border-radius: 10px; }
.switch .arrow { color: var(--accent); font-size: 20px; line-height: 1; }
[dir="rtl"] .switch .arrow { transform: scaleX(-1); }
.switch .mid { display: grid; justify-items: center; font-family: var(--f-display); font-weight: 500; font-size: 16px; }
.switch .mid small { font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); }

.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg label, .seg button { flex: 1; text-align: center; padding: 7px 6px; border-radius: 8px; font-size: 13.5px; font-weight: 500; border: 0; background: none; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked), .seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* beam */
.beam { padding: 16px 14px 4px; }
.beam svg { display: block; width: 100%; height: auto; max-width: 100%; }
.beam .post { fill: var(--brass); }
.beam .arm { stroke: var(--brass); stroke-width: 3; stroke-linecap: round; }
.beam .pan { fill: none; stroke: var(--brass); stroke-width: 2; }
.beam text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.beam .val { fill: var(--ink); font-size: 14px; font-family: var(--f-display); font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { .beam .tilt { transition: transform .6s cubic-bezier(.3,1.4,.5,1); } }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.dayhead { display: flex; justify-content: space-between; gap: 8px; padding: 0 4px 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }

/* charts */
.chart { padding: 12px 10px 4px; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 300px; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 4px 14px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-inline-end: 5px; vertical-align: middle; }

/* hero number */
.hero { padding: 16px 14px 6px; }
.hero span { font-size: 12px; color: var(--muted); }
.hero b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 34px; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero .rule { height: 2px; width: 56px; background: var(--brass); margin-top: 8px; border-radius: 2px; }

/* modal sheet */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(5, 18, 16, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .modal { align-items: center; } .sheet { border-radius: 18px; max-height: 86%; } }
.sheet-h { position: sticky; top: 0; z-index: 1; background: var(--bg); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 16px; text-align: center; }
.sheet-h .end { justify-self: end; }
.sheet-h .start { justify-self: start; }
.sheet-b { padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.field input[type="text"], .field input[type="date"], .field input[type="number"], .field select, .field textarea, .inp {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 12px; min-width: 0; }
.money { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 0 12px; }
.money input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; outline: none; }
.money em { font-style: normal; color: var(--muted); font-size: 13px; }
.money.big input { font-family: var(--f-display); font-size: 34px; font-weight: 600; padding: 6px 0; }
.money:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
.toggle input { width: 42px; height: 24px; appearance: none; background: var(--surface-2); border-radius: 999px; position: relative; cursor: pointer; flex: none; transition: background .2s; }
.toggle input::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: inset-inline-start .2s; }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { inset-inline-start: 21px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 7px; }
.chips label { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; cursor: pointer; min-width: 0; }
.chips label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); font-weight: 600; }
.chips label:has(input:focus-visible) { outline: 2px solid var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.swatches { display: flex; flex-wrap: wrap; gap: 9px; }
.swatches label { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; position: relative; }
.swatches input { position: absolute; opacity: 0; }
.swatches label:has(input:checked) { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.hint { font-size: 13px; color: var(--muted); }
.hint.bad { color: var(--bad); }
.err { color: var(--bad); font-size: 13px; }
.formsec { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding-top: 4px; }

.quick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 13px; font-size: 13.5px; }
.quick button small { color: var(--muted); font-size: 12px; }
.quick button:hover { border-color: var(--accent); }
.safe { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 14px 0; }
.safe b { font-family: var(--f-display); font-weight: 600; font-size: 28px; letter-spacing: -0.01em; }
.safe span { font-size: 12.5px; color: var(--muted); }
.hij { font-weight: 400; color: var(--muted); }
.tour { text-align: start; }
.tour-art { width: 120px; height: 120px; border-radius: 34px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: 18px; }
.tour-art svg { width: 64px; height: 64px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 20px; border-radius: 4px; }
.toast:not([hidden]) { display: flex; align-items: center; gap: 14px; }
[hidden] { display: none !important; }
.toast button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; max-width: calc(100% - 32px); }
.banner > span { min-width: 0; }
.banner { background: color-mix(in srgb, var(--brass) 14%, var(--surface)); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* onboarding */
.ob { max-width: 560px; margin: 0 auto; padding-block: 18px 40px; display: grid; gap: 16px; }
.ob .logo { width: 64px; height: 64px; border-radius: 18px; background: var(--accent); display: grid; place-items: center; }
.ob h1 { font-family: var(--f-display); font-weight: 600; font-size: 38px; margin: 0; letter-spacing: -0.02em; }
.ob h1 small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
.ob .lead { color: var(--muted); max-width: 46ch; margin: 0; }
.ob .nav { display: flex; justify-content: space-between; gap: 10px; }
.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.tmpl { display: grid; gap: 8px; }
.tmpl label { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.tmpl input { margin-top: 4px; accent-color: var(--accent); }
.tmpl label:has(input:checked) { border-color: var(--accent); }
.tmpl b { display: block; font-family: var(--f-display); font-weight: 500; }
.tmpl span { font-size: 13px; color: var(--muted); }
.ring text { font-family: var(--f-display); font-weight: 600; fill: var(--ink); }
.status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); padding: 2px 4px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.ok i { background: var(--good); }
.status.local i { background: var(--warn); }
textarea.inp { min-height: 180px; font-family: ui-monospace, monospace; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="view" class="stack"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="filepick" accept=".json,application/json" hidden>
<input type="file" id="xlsxpick" accept=".xlsx,.xls,.xlsm,.csv" hidden>

<script>

let LANG = "en";
function tr(s) { return LANG === "ar" ? (AR[s] ?? s) : s; }
function trf(s, ...a) { let i = 0; return tr(s).replace(/%%|%@|%d/g, m => m === "%%" ? "%" : String(a[i++])); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ================= Dates & periods ================= */
const pad = n => String(n).padStart(2, "0");
const D = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const isoOf = dt => D(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
const today = () => isoOf(new Date());
function P(s) { const [y, m, d] = String(s).split("-").map(Number); return { y, m, d: d || 1 }; }
const dim = (y, m) => new Date(y, m, 0).getDate();
function mk(y, m) { const t = y * 12 + (m - 1); return { y: Math.floor(t / 12), m: ((t % 12) + 12) % 12 + 1 }; }
const addM = (k, n) => mk(k.y, k.m + n);
const kid = k => k.y * 100 + k.m;
function addMonthsISO(s, n, anchor) { const p = P(s); const k = addM(p, n); return D(k.y, k.m, Math.min(anchor || p.d, dim(k.y, k.m))); }
function addDaysISO(s, n) { const p = P(s); return isoOf(new Date(p.y, p.m - 1, p.d + n)); }
function daysBetween(a, b) { const x = P(a), y = P(b); return Math.round((Date.UTC(y.y, y.m - 1, y.d) - Date.UTC(x.y, x.m - 1, x.d)) / 864e5); }
function locale() { return LANG === "ar" ? "ar-SA-u-ca-gregory-nu-latn" : "en-US"; }
function fmtDate(s, opts) { const p = P(s); return new Intl.DateTimeFormat(locale(), opts).format(new Date(p.y, p.m - 1, p.d, 12)); }
const monthShort = m => fmtDate(D(2026, m, 1), { month: "short" });
const monthTitle = k => fmtDate(D(k.y, k.m, 1), { month: "long", year: "numeric" });
const dayMonth = s => fmtDate(s, { day: "numeric", month: "short" });
const shortDate = s => fmtDate(s, { day: "numeric", month: "short", year: "numeric" });
const dayHeader = s => fmtDate(s, { weekday: "long", day: "numeric", month: "short" });

function startDay() { return Math.min(Math.max(DATA.settings.startDay || 1, 1), 31); }
function periodOf(s) { const { y, m, d } = P(s); const sd = startDay(); if (sd <= 1) return { y, m }; return d >= Math.min(sd, dim(y, m)) ? addM({ y, m }, 1) : { y, m }; }
function pStart(k) { const sd = startDay(); if (sd <= 1) return D(k.y, k.m, 1); const p = addM(k, -1); return D(p.y, p.m, Math.min(sd, dim(p.y, p.m))); }
const pEnd = k => pStart(addM(k, 1));
const inP = (k, s) => s >= pStart(k) && s < pEnd(k);
const curP = () => periodOf(today());
const pRange = k => `${dayMonth(pStart(k))} – ${dayMonth(addDaysISO(pEnd(k), -1))}`;

      else DATA.expenses.push({ id: uid(), date: r.nextDate, category: r.category, details: r.name, amount: r.amount, account: r.account, source: r.uid });
      r.nextDate = nextOf(r, r.nextDate); changed = true;

    const k = i.postedCount; DATA.expenses.push({ id: uid(), date: instDate(i, k), category: i.category, details: trf("%@ · payment %d of %d", i.name, k + 1, i.count), amount: instAmt(i, k), account: i.account, source: i.uid });
    i.postedCount++; changed = true;

    const k = l.postedCount; DATA.expenses.push({ id: uid(), date: loanDate(l, k), category: l.category, details: trf("%@ · payment %d of %d", l.name, k + 1, l.termMonths), amount: loanPay(l), account: l.account, source: l.uid });
    l.postedCount++; changed = true;

    if (!s) { s = { id: uid(), year: p.y, month: p.m, value: 0, assets: 0, liabilities: 0 }; DATA.snapshots.push(s); }

/** Compares the monthly Annual Account budget with what this year's plan still needs. */
function fundPaceNote(y, still, left) {
  if (y !== curP().y || left <= 0) return "";
  const fundCats = DATA.categories.filter(c => c.isAnnualTransfer), per = fundCats.reduce((n, c) => n + (+c.monthlyAllocation || 0), 0);
  if (!fundCats.length) return "";
  const need = still / left, name = fundCats.map(c => c.name).join(", ");
  if (per > need + Math.max(50, need * 0.1)) return `<div class="note">${esc(need < 1 ? trf("Your %@ budget is %@ a month, but this year's plan is already covered. You could move it back to spending, or keep saving it for next year.", name, money(per))
    : trf("Your %@ budget is %@ a month, but the plan only needs %@ a month. You could move %@ a month back to spending, or keep saving it for next year.", name, money(per), money(need), money(per - need)))}</div>`;
  if (per + Math.max(50, need * 0.1) < need) return `<div class="note warn">${esc(trf("Your %@ budget is %@ a month, but the plan needs %@ a month. Raise it, or lower some yearly categories.", name, money(per), money(need)))}</div>`;
  return "";

/* ================= Possible duplicates ================= */
let DUPS = null;

  const add = (pre, x, key) => { const k = pre + key, prev = seen[k];
    if (prev && Math.abs((prev.at || 0) - (x.at || 0)) > 5000) { s.add(prev.id); s.add(x.id); } else if (!prev) seen[k] = x; };

/* ================= Yearly fund ↔ investment ================= */
/** Money sitting in the yearly fund across every year: all deposits minus all yearly purchases. */
function fundBalanceAll() {
  const ys = new Set([curP().y]); DATA.annualCategories.forEach(c => ys.add(c.year)); DATA.annualExpenses.forEach(e => ys.add(fundYearOf(e))); DATA.deposits.forEach(d => ys.add(d.year));
  const tn = new Set(DATA.categories.filter(c => c.isAnnualTransfer).map(c => c.name)); DATA.expenses.forEach(e => { if (tn.has(e.category)) ys.add(periodOf(e.date).y); });
  if (fundAccount()) DATA.transfers.forEach(t => ys.add(periodOf(t.date).y));
  let n = 0; for (const y of ys) for (let m = 1; m <= 12; m++) n += depOf(y, m);
  return n - DATA.annualExpenses.reduce((a, e) => a + e.amount, 0);
}
function fundInvestPanel() {

  const p = portfolios().find(x => x.name === name), bal = fundBalanceAll(), value = p ? p.value : 0, invested = p ? p.net : 0, gain = value - invested, upd = p ? p.list.at(-1).date : null;
  const own = p && p.list.some(e => e.contribution), gap = bal - invested;
  const fromCats = p ? p.list.filter(e => e.link && investLinked(e)).reduce((n, e) => n + e.contribution, 0) : 0;
  const note = fromCats ? trf("%@ of the money put in came from your yearly categories, so it's already counted as used in the fund.", money(fromCats)) : !own ? tr("Money put in is taken as your yearly fund balance: everything deposited minus everything bought.")
    : Math.abs(gap) < 1 ? tr("All of your yearly fund is invested.") : gap > 0 ? trf("%@ of your yearly fund isn't invested yet.", money(gap)) : trf("%@ more is invested than your yearly fund holds (money from outside the fund).", money(-gap));
  return panel(trf("Invested in %@", name), tiles([tile(tr("Investment value"), p ? money(value) : "—"), tile(tr("Money put in"), p ? money(invested) : "—"),
      tile(p && invested > 0 ? trf("Profit (%@)", Math.round(gain / invested * 100) + "%") : tr("Profit"), p ? money(gain) : "—", gain < 0 ? "neg" : "pos"), tile(tr("Fund balance"), money(bal))])

    esc((upd ? trf("Value updated %@.", shortDate(upd)) + " " : "") + note));

const standalone = () => !(window.claude && window.claude.use);
function browserDownload(name, data, type) {
  try { const blob = data instanceof Blob ? data : new Blob([data], { type: type || "application/octet-stream" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true; } catch (e) { return false; }
}
async function saveFile(name, text) {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (dl) { try { await dl.save({ filename: name, data: text }); return true; } catch (e) { if (e && e.code === "declined") return false; } }
  if (standalone() && browserDownload(name, text, name.endsWith(".csv") ? "text/csv" : "application/json")) return true;
  openSheet(name, `<p class="hint">${esc(tr("Copy this text and save it as a file on your device."))}</p><textarea class="inp" id="exportText" readonly>${esc(text)}</textarea><button class="btn primary" data-act="copyExport">${esc(tr("Copy"))}</button>`);
}
function exportData() { const out = { ...DATA, version: 2 }; return JSON.stringify(out, null, 1); }
function exportCSV() {
  const q = s => '"' + String(s ?? "").replace(/"/g, '""') + '"';
  const rows = ["Date,Period,Type,Category,Details,Amount,Account"];
  [...DATA.expenses].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => { const k = periodOf(e.date); rows.push([e.date, `${k.y}-${pad(k.m)}`, "Expense", q(e.category), q(e.details), -e.amount, q(accName(e.account))].join(",")); });
  [...DATA.incomes].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => { const k = periodOf(e.date); rows.push([e.date, `${k.y}-${pad(k.m)}`, "Income", q(e.source), q(e.details), e.amount, q(accName(e.account))].join(",")); });
  DATA.annualExpenses.forEach(e => rows.push([e.date, "", "Yearly", q(e.category), q(e.details), -e.amount, q(accName(e.account))].join(",")));
  DATA.transfers.forEach(t => rows.push([t.date, "", "Transfer", q(accName(t.from) + " → " + accName(t.to)), q(t.details), t.amount, ""].join(",")));
  return "﻿" + rows.join("\n");
}

  };

function recapData(k) {
  const l = L(), h = health(k), inc = l.totalIncome(k), sp = l.totalSpent(k);
  const cats = l.cats.map(c => ({ name: c.name, color: c.color, kind: c.kind, spent: l.spent(c.name, k), budget: l.available(c, k) }));
  const top = cats.filter(c => c.spent > 0 && c.kind === "variable").sort((a, b) => b.spent - a.spent).slice(0, 3);
  const bud = cats.filter(c => c.budget > 0 && c.kind === "variable");
  const best = bud.filter(c => c.spent <= c.budget).sort((a, b) => (b.budget - b.spent) - (a.budget - a.spent))[0];
  const worst = cats.filter(c => c.budget > 0 && c.spent > c.budget + 0.005).sort((a, b) => (b.spent - b.budget) - (a.spent - a.budget))[0];
  const saved = l.byGroup(k).savings + Math.max(0, l.balance(k));
  return { h, inc, sp, bal: l.balance(k), rate: inc > 0 ? saved / inc : 0, top, best, worst };
}

/* ================= Left to allocate ================= */
function monthlyIncomeRef() {
  const k = curP(), l = L(), actual = l.totalIncome(k);
  const planned = DATA.recurring.filter(r => r.isIncome && r.active).reduce((n, r) => n + r.amount * FREQ[r.frequency] / 12, 0);
  return Math.max(actual, planned + l.forwarded(k));
}
function allocHint(v, c) {
  const inc = monthlyIncomeRef(); if (!(inc > 0)) return `<span>${esc(tr("Add your income to see what's left to allocate."))}</span>`;
  const others = DATA.categories.filter(x => x !== c).reduce((n, x) => n + (+x.monthlyAllocation || 0), 0), left = inc - others - (v || 0);
  return `<b class="${left < -0.5 ? "neg" : left > 0.5 ? "warn" : "pos"}">${esc(left < -0.5 ? trf("Over-allocated by %@", money(-left)) : trf("Left to allocate after this: %@", money(left)))}</b><br>${esc(trf("Income %@ · other categories %@", money(inc), money(others)))}`;
}
function yearlyHint(v, c, y) {
  const names = new Set(DATA.categories.filter(x => x.isAnnualTransfer).map(x => x.name));
  let dep = 0; for (let m = 1; m <= 12; m++) { const o = DATA.deposits.find(d => d.year === y && d.month === m); dep += depOf(y, m); void o; }
  const now = curP(), monthsLeft = y < now.y ? 0 : y > now.y ? 12 : 12 - now.m;
  const perMonth = DATA.categories.filter(x => x.isAnnualTransfer).reduce((n, x) => n + (+x.monthlyAllocation || 0), 0), expected = dep + perMonth * monthsLeft;
  const others = DATA.annualCategories.filter(x => x.year === y && x !== c).reduce((n, x) => n + x.allocated, 0), left = expected - others - (v || 0);
  return `<b class="${left < -0.5 ? "neg" : "pos"}">${esc(left < -0.5 ? trf("More than your expected deposits by %@", money(-left)) : trf("Left to allocate after this: %@", money(left)))}</b><br>${esc(trf("Expected deposits this year %@ · other categories %@", money(expected), money(others)))}`;
}

/* ================= v2.6: can I afford it? ================= */
function affordCalc(price) {
  const k = curP(), l = L(), safe = safeToday(k), now = safe ? safe.left : Math.max(0, l.balance(k));
  const yf = yearFund(k.y), cons = DATA.annualExpenses.filter(e => fundYearOf(e) === k.y).reduce((n, e) => n + e.amount, 0);
  const fbal = yf.deposited - cons, free = Math.max(0, fbal - yf.rows.reduce((n, r) => n + Math.max(0, r.available), 0));
  const past = [1, 2, 3].map(i => addM(k, -i)).filter(p => l.received(p) > 0);
  let pace = past.length ? past.reduce((n, p) => n + Math.max(0, l.balance(p)), 0) / past.length : 0, guess = false;
  if (pace < 1) { pace = Math.round(monthlyIncomeRef() * 0.1); guess = true; }
  const months = pace > 0 ? Math.max(1, Math.ceil(price / pace)) : null;
  return { now, days: safe ? safe.days : daysBetween(today(), pEnd(k)), fbal, free, pace, guess, months, ready: months ? addM(k, months) : null };
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) { if (e.target.id === "modal") closeModal(); return; }
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.s) { const k = t.dataset.s; if (k === "lang") { LANG = t.value; DATA.settings.lang = t.value; } else DATA.settings[k] = k === "startDay" ? +t.value : t.value; if (k === "startDay") ui.month = curP(); commit(); }
  else if (t.dataset.z) { const z = DATA.settings.zakat; z[t.dataset.z] = t.type === "checkbox" ? t.checked : t.type === "range" ? +t.value : t.value; commit(); }
  else if (t.dataset.ob !== undefined && (t.type === "checkbox" || t.tagName === "SELECT")) { readOb(); if (t.dataset.ob === "country") { const c = COUNTRIES[t.value]; ui.obd.currency = c.cur; ui.obd.payday = c.payday; } render(); }
  else if (t.id === "filepick" && t.files[0]) { handleImportFile(t.files[0]); t.value = ""; }
  else if (t.id === "xlsxpick" && t.files[0]) { handleExcelFile(t.files[0]); t.value = ""; }
});

document.addEventListener("keydown", e => { if (e.key === "Escape" && !MODAL().hidden) closeModal(); });
